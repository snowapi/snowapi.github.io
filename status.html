<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow API · статус сервера</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Монохромная тёмная тема */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0f14;
            font-family: 'Courier New', Courier, monospace;
            color: #e4e4e4;
            line-height: 1.5;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #1a1c22;
            border: 1px solid #2f333d;
            border-radius: 2rem;
            padding: 2.5rem 2rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #2f333d;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        h1 i {
            color: #b0b0b0;
        }
        .badge {
            background: #2a2e38;
            border: 1px solid #4b5263;
            color: #ccc;
            font-size: 0.9rem;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            margin-left: 1rem;
        }
        .gateway-info {
            background: #20242e;
            border-left: 4px solid #6f7c91;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
            justify-content: space-between;
        }
        .gateway-info-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .gateway-info-item i {
            width: 1.6rem;
            color: #9aa9b9;
        }
        .label {
            color: #9aaec9;
            margin-right: 0.5rem;
        }
        .value {
            color: #e1e7f5;
            font-weight: 500;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .status-card {
            background: #15181f;
            border: 1px solid #2e3440;
            border-radius: 1.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .card-header i {
            font-size: 1.8rem;
            color: #b7c3da;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 500;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.online { background: #5f9ea0; box-shadow: 0 0 8px #5f9ea0; }
        .dot.degraded { background: #c9a45f; box-shadow: 0 0 8px #c9a45f; }
        .dot.offline { background: #a05f5f; box-shadow: 0 0 8px #a05f5f; }
        .status-text {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Блок графиков нагрузки */
        .metrics {
            background: #20242e;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin: 2rem 0 1rem;
        }
        .metrics-title {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #b7c3da;
            border-bottom: 1px dashed #2f384b;
            padding-bottom: 0.8rem;
        }
        .charts {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: space-around;
        }
        .chart-container {
            flex: 1 1 200px;
            text-align: center;
        }
        .chart-container h3 {
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            color: #9aaec9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            background: #15181f;
            border-radius: 1rem;
            border: 1px solid #2e3440;
            margin: 0 auto;
        }
        .chart-value {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            color: #e1e7f5;
        }

        .last-updated {
            text-align: right;
            color: #6b7a8f;
            font-size: 0.85rem;
            margin-top: 2rem;
            border-top: 1px solid #2f333d;
            padding-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #5f6a7c;
            font-size: 0.85rem;
        }
        .footer a {
            color: #b7c3da;
            text-decoration: none;
            border-bottom: 1px dotted #4f5b70;
        }
        .footer a:hover {
            color: white;
            border-bottom-color: #aaa;
        }
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
            .gateway-info { flex-direction: column; align-items: flex-start; gap: 0.8rem; }
            .charts { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fas fa-snowflake"></i> Snow API
            <span class="badge">v2.0</span>
        </h1>

        <!-- информация о шлюзе (без времени) -->
        <div class="gateway-info">
            <div class="gateway-info-item">
                <i class="fas fa-server"></i>
                <span class="label">gateway</span>
                <span class="value">christofari-neo.snowapi.ru</span>
            </div>
            <div class="gateway-info-item">
                <i class="fas fa-tachometer-alt"></i>
                <span class="label">нагрузка</span>
                <span class="value" id="load-value">23%</span>
            </div>
        </div>

        <!-- сетка статусов модулей (только названия и статус) -->
        <div class="status-grid">
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-dna"></i>
                    <span class="card-title">bio‑ml</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-seedling"></i>
                    <span class="card-title">plant</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-protein"></i>
                    <span class="card-title">rosetta</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-film"></i>
                    <span class="card-title">animation</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-robot"></i>
                    <span class="card-title">autoresearch</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="card-header">
                    <i class="fas fa-atom"></i>
                    <span class="card-title">quantum</span>
                    <div class="status-indicator">
                        <span class="dot online"></span>
                        <span class="status-text">online</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- интерактивные графики нагрузки в реальном времени -->
        <div class="metrics">
            <div class="metrics-title">
                <i class="fas fa-chart-line"></i> нагрузка в реальном времени
            </div>
            <div class="charts">
                <div class="chart-container">
                    <h3><i class="fas fa-microchip"></i> CPU</h3>
                    <canvas id="cpuChart" width="280" height="100"></canvas>
                    <div class="chart-value" id="cpuValue">--%</div>
                </div>
                <div class="chart-container">
                    <h3><i class="fas fa-memory"></i> RAM</h3>
                    <canvas id="ramChart" width="280" height="100"></canvas>
                    <div class="chart-value" id="ramValue">--%</div>
                </div>
                <div class="chart-container">
                    <h3><i class="fas fa-network-wired"></i> NET</h3>
                    <canvas id="netChart" width="280" height="100"></canvas>
                    <div class="chart-value" id="netValue">-- Mb/s</div>
                </div>
            </div>
        </div>

        <!-- время последнего обновления (только здесь) -->
        <div class="last-updated">
            <span><i class="far fa-clock"></i> <span id="live-time">10 марта 2026, 15:30:22 UTC</span></span>
            <span><i class="fas fa-sync-alt"></i> интервал 1с</span>
        </div>

        <!-- футер -->
        <div class="footer">
            <i class="fas fa-github"></i> <a href="https://github.com/snowapi/snowapi">snowapi/snowapi</a> · 
            <a href="https://snowapi.github.io/">документация</a> · 
            <a href="https://vkplay.ru/">VK Play</a>
        </div>
    </div>

    <script>
        (function() {
            // ---- интерактивное время (обновление каждую секунду) ----
            function updateTime() {
                const now = new Date();
                const year = now.getUTCFullYear();
                const month = String(now.getUTCMonth() + 1).padStart(2,'0');
                const day = String(now.getUTCDate()).padStart(2,'0');
                const hours = String(now.getUTCHours()).padStart(2,'0');
                const minutes = String(now.getUTCMinutes()).padStart(2,'0');
                const seconds = String(now.getUTCSeconds()).padStart(2,'0');
                const formatted = `${day} ${getMonthName(now.getUTCMonth())} ${year}, ${hours}:${minutes}:${seconds} UTC`;
                document.getElementById('live-time').innerText = formatted;
            }
            function getMonthName(index) {
                const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
                return months[index];
            }
            updateTime();
            setInterval(updateTime, 1000);

            // ---- графики нагрузки и интерактивность ----
            // Храним историю для каждого графика (по 20 точек)
            const maxPoints = 20;
            let cpuHistory = new Array(maxPoints).fill(20); // начальные значения
            let ramHistory = new Array(maxPoints).fill(30);
            let netHistory = new Array(maxPoints).fill(5);  // в Mb/s

            // Получаем canvas и контексты
            const cpuCanvas = document.getElementById('cpuChart');
            const ramCanvas = document.getElementById('ramChart');
            const netCanvas = document.getElementById('netChart');
            const cpuCtx = cpuCanvas.getContext('2d');
            const ramCtx = ramCanvas.getContext('2d');
            const netCtx = netCanvas.getContext('2d');

            // Элементы для отображения текущих значений
            const cpuValueEl = document.getElementById('cpuValue');
            const ramValueEl = document.getElementById('ramValue');
            const netValueEl = document.getElementById('netValue');
            const loadValueEl = document.getElementById('load-value'); // общая нагрузка в gateway

            // Генерация случайных данных (имитация real-time)
            function generateNewValues() {
                // CPU: случайное от 5 до 85
                const newCpu = Math.floor(Math.random() * 60 + 15);
                // RAM: случайное от 30 до 90
                const newRam = Math.floor(Math.random() * 50 + 30);
                // NET: случайное от 2 до 40 Mb/s
                const newNet = (Math.random() * 30 + 5).toFixed(1);

                cpuHistory.push(newCpu);
                ramHistory.push(newRam);
                netHistory.push(parseFloat(newNet));

                if (cpuHistory.length > maxPoints) cpuHistory.shift();
                if (ramHistory.length > maxPoints) ramHistory.shift();
                if (netHistory.length > maxPoints) netHistory.shift();

                // Обновляем цифры
                cpuValueEl.innerText = newCpu + '%';
                ramValueEl.innerText = newRam + '%';
                netValueEl.innerText = newNet + ' Mb/s';
                loadValueEl.innerText = newCpu + '%';  // обновляем нагрузку в gateway-info
            }

            // Отрисовка графика на канвасе
            function drawChart(ctx, data, color, maxY) {
                const w = ctx.canvas.width;
                const h = ctx.canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (data.length < 2) return;

                // Находим максимум для масштабирования
                const maxVal = Math.max(...data, maxY);
                const minVal = Math.min(...data, 0);
                const range = maxVal - minVal || 1;

                // Рисуем сетку (опционально)
                ctx.strokeStyle = '#2f384b';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                for (let i = 0; i <= 4; i++) {
                    const y = h - 10 - (i * (h-20)/4);
                    ctx.moveTo(10, y);
                    ctx.lineTo(w-10, y);
                }
                ctx.stroke();

                // Рисуем линию графика
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();

                const step = (w - 20) / (data.length - 1);
                for (let i = 0; i < data.length; i++) {
                    const x = 10 + i * step;
                    // Масштабируем значение: (значение - minVal) / range * (h-20) и отражаем по y
                    const y = h - 10 - ((data[i] - minVal) / range) * (h - 20);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // Рисуем точки
                ctx.fillStyle = color;
                for (let i = 0; i < data.length; i++) {
                    const x = 10 + i * step;
                    const y = h - 10 - ((data[i] - minVal) / range) * (h - 20);
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            // Обновление всех графиков
            function updateCharts() {
                drawChart(cpuCtx, cpuHistory, '#5f9ea0', 100);
                drawChart(ramCtx, ramHistory, '#b38f5f', 100);
                drawChart(netCtx, netHistory, '#8f9eb3', 50); // для сети максимум 50 Mb/s
            }

            // Цикл обновления (каждую секунду)
            function tick() {
                generateNewValues();
                updateCharts();
            }

            // Первоначальная отрисовка
            tick();
            setInterval(tick, 1000);
        })();
    </script>
</body>
</html>
